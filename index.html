<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2e7;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #5d6673;
    --line: #e6dfcd;
    --forest: #0d4a73;      /* deep blue: top bar, headings, buttons */
    --forest-2: #1a7ab8;    /* brand blue: links, highlights */
    --wed: #1a7ab8;         /* Wednesday practice */
    --sat: #0e8f8c;         /* Saturday practice */
    --sun: #2f7d4a;         /* Sunday 3D in the woods */
    --gold: #f2b705;
    --red: #d64541;
    --blue: #2f6fb5;
    --ai: #7b4bb7;
    --ifaf: #e07a1f;
    --chip: #eef2f6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --surface: #18212b; --ink: #e8eef4; --muted: #9aa7b4;
      --line: #2a3540; --forest: #2577b3; --forest-2: #5ab0e6; --chip: #22303c;
      --wed: #4aa3dc; --sat: #2bb3af; --sun: #4fa36b;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: "Barlow Condensed", Inter, sans-serif; letter-spacing: .01em; margin: 0; }

  /* Header */
  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(90deg, #f2b705, #f7e6a3 42%, #a9d8ee 58%, #1a7ab8); }
  header.top { background: #0d4a73; color: #fff; padding: 14px 16px 16px;
    padding-top: calc(14px + env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { flex: none; width: 46px; height: 39px; object-fit: cover; border-radius: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  .brand h1 { font-size: 24px; line-height: 1.1; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 38px; height: 38px;
    border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn.on { background: var(--gold); color: #1d2a22; }
  .admin-banner { margin-top: 10px; font-size: 13px; background: rgba(242,183,5,.18); color: #ffe7a3;
    border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
  .admin-banner button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; padding: 0; }

  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .section-title { font-size: 20px; margin: 4px 0 10px; color: var(--forest); }
  @media (prefers-color-scheme: dark) { .section-title { color: var(--forest-2); } }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }

  /* Name bar */
  .namebar label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .namebar input { width: 100%; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; width: 100%; font-size: 16px; }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--forest-2); outline-offset: 0; border-color: transparent; }

  .ver { text-align: center; font-size: 12px; color: var(--muted); margin: 18px 0 4px; }

  .form label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); }
  .form label.check input { width: 20px; height: 20px; accent-color: var(--forest-2); }
  .session .type-pill { margin-bottom: 2px; }

  /* Club code screen */
  .gated nav.tabs, .gated #refreshBtn, .gated #adminBtn, .gated #adminBanner { display: none !important; }
  .gate-logo { display: block; width: min(230px, 70%); height: auto; margin: 0 auto 16px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .loading .gate-logo { width: 180px; margin-bottom: 22px; }
  .gate { margin-top: 24px; text-align: center; padding: 22px 18px; }
  .gate h2 { font-size: 24px; color: var(--forest); margin-bottom: 6px; }
  .gate p { color: var(--muted); margin: 0 0 14px; }
  .gate input { text-align: center; font-size: 20px; letter-spacing: .08em; margin-bottom: 12px; }
  .gate input.bad { border-color: var(--red); }
  .gate .btn { width: 100%; padding: 13px; }

  .ios-tip { position: relative; background: #fff7d6; border-color: #f2d36b; padding-right: 40px; font-size: 14px; }
  .ios-tip .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  @media (prefers-color-scheme: dark) { .ios-tip { background: #3a3218; border-color: #6b5a1e; } }

  #refreshBtn.syncing svg { animation: s 1s linear infinite; }

  details.admin.editing { border-style: solid; border-color: var(--forest-2); background: rgba(26,122,184,.06); }

  /* Search */
  .searchbar { position: relative; margin-bottom: 10px; }
  .searchbar svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .searchbar input { padding-left: 38px; border-radius: 99px; }

  /* Forum */
  details.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  details.ask summary { cursor: pointer; font-weight: 600; color: var(--forest-2); }
  .thread-row { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .thread-row .t { font-weight: 600; font-size: 16px; }
  .thread-row .s { color: var(--muted); font-size: 13px; }
  .thread-row .replies { font-size: 13px; font-weight: 600; color: var(--forest-2); }
  .thread-row .replies.none { color: var(--muted); font-weight: 400; }
  .back { border: 0; background: none; color: var(--forest-2); font-weight: 600; padding: 4px 0 10px; cursor: pointer; font-size: 15px; }
  .thread h2 { font-size: 22px; margin-bottom: 8px; }
  .post .by { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .post .by strong { color: var(--ink); }
  .post .del { margin-left: auto; border: 0; background: none; color: var(--red); font-size: 13px; cursor: pointer; padding: 2px 0; }
  .post .txt { white-space: pre-wrap; margin-top: 4px; overflow-wrap: anywhere; }
  .reply.card { padding: 12px 14px; margin-bottom: 8px; }
  .post.mine .by strong::after { content: ' (you)'; font-weight: 400; color: var(--muted); }

  /* Club */
  .club-sec h2 { font-size: 21px; color: var(--forest); margin-bottom: 6px; }
  .role { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .role:first-of-type { border-top: 0; }
  .role .r { color: var(--muted); }
  .role .n { font-weight: 600; text-align: right; }
  .info { padding: 8px 0; border-top: 1px solid var(--line); }
  .info:first-of-type { border-top: 0; }
  .info .it { font-weight: 600; }
  .info .id { white-space: pre-wrap; overflow-wrap: anywhere; }
  .info .id.mono { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; }
  .ph { color: var(--muted) !important; font-style: italic; font-weight: 400 !important; }
  .copy { margin-left: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; font: 600 12px Inter, sans-serif; padding: 3px 9px; cursor: pointer; color: var(--ink); vertical-align: 1px; }
  .honours-hero { position: relative; overflow: hidden; text-align: center; color: #fff; border-radius: 18px; padding: 22px 16px 18px; margin-bottom: 14px;
    background: radial-gradient(120% 90% at 50% 0%, #1a7ab8 0%, #0d4a73 70%); box-shadow: var(--shadow); }
  .honours-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, #f2b705, #f7e6a3 42%, #a9d8ee 58%, #1a7ab8); }
  .honours-hero .trophy { width: 62px; height: 62px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff1a8, #f2b705 60%, #c99500); color: #5a4300; box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
  .honours-hero .trophy svg { width: 34px; height: 34px; }
  .honours-hero h1 { font-size: 30px; line-height: 1.1; }
  .honours-hero p { margin: 2px 0 12px; opacity: .85; }
  .tally { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .tally span { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border-radius: 99px; padding: 5px 12px 5px 6px; font-size: 14px; }
  .tally b { font-size: 18px; font-family: "Barlow Condensed", Inter, sans-serif; }
  .tally-note { font-size: 12px; opacity: .75; margin-top: 8px; }
  .medal.sm { width: 22px; height: 22px; display: inline-block; flex: none; }
  .congrats { background: linear-gradient(180deg, #fff8dc, #fff); border-color: #f2d36b; }
  .congrats .cg-head { display: flex; align-items: center; gap: 8px; color: #8a6400; font-size: 17px; margin-bottom: 6px; }
  .congrats .cg-head svg { width: 22px; height: 22px; }
  .congrats .cg-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .congrats .cg-row .s { color: var(--muted); font-size: 13px; }
  .congrats .btn { margin-top: 6px; }
  @media (prefers-color-scheme: dark) { .congrats { background: linear-gradient(180deg, #3a3218, var(--surface)); border-color: #6b5a1e; } .congrats .cg-head { color: #f2d36b; } }
  .res-filters { display: flex; gap: 8px; margin-bottom: 10px; }
  .res-filters select { flex: 1; min-width: 0; }
  .result { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .result:first-child { border-top: 0; padding-top: 0; }
  .medal { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 700 15px "Barlow Condensed", Inter, sans-serif; color: #1b2430; }
  .medal.gold { background: radial-gradient(circle at 35% 30%, #fff1a8, #f2b705 60%, #c99500); }
  .medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c9ced6 60%, #9aa1ab); }
  .medal.bronze { background: radial-gradient(circle at 35% 30%, #f7d2b0, #cd7f32 60%, #9c5a1d); color: #fff; }
  .medal.other { background: var(--chip); color: var(--muted); }
  .result .t { font-weight: 600; }
  .result .cat { font-weight: 400; color: var(--muted); font-size: 13px; }
  .result .s { color: var(--muted); font-size: 14px; }
  .btn.soon { background: var(--chip); color: var(--muted); border: 1px dashed var(--line); cursor: default; opacity: 1; }

  /* Week picker */
  .weektabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 5px; margin-bottom: 14px; overflow-x: auto; box-shadow: var(--shadow); }
  .wk { flex: 1 0 96px; border: 0; background: transparent; border-radius: 10px; padding: 8px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
  .wk .wk-name { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
  .wk .wk-dates { font-size: 12px; }
  .wk.on { background: var(--forest); color: rgba(255,255,255,.85); }
  .wk.on .wk-name { color: #fff; }
  .wk-me { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
  .week-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
    border-left: 4px solid var(--forest-2); padding: 2px 0 2px 12px; margin: 0 0 12px; }
  .week-head h2 { font-size: 24px; line-height: 1.1; color: var(--forest); }
  .week-dates { color: var(--muted); font-size: 14px; }
  .week-sum { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .pill { background: var(--chip); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.mine { background: var(--gold); color: #1d2a22; }
  .next-week { display: block; width: 100%; margin: 4px 0 8px; padding: 14px; border-radius: 14px; cursor: pointer;
    border: 1px dashed var(--forest-2); background: transparent; color: var(--forest-2); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .week-head h2 { color: var(--forest-2); } }

  /* Session cards */
  .session { display: flex; gap: 14px; }
  .when { flex: none; width: 58px; text-align: center; border-radius: 12px; padding: 8px 0;
    color: #fff; background: var(--wed); align-self: flex-start; }
  .session.sun .when { background: var(--sun); }
  .session.sat .when { background: var(--sat); }
  .when .dow { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .9; }
  .when .dnum { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 28px; line-height: 1; font-weight: 700; }
  .when .mon { display: block; font-size: 12px; opacity: .9; }
  .session .body { flex: 1; min-width: 0; }
  .session h3 { font-size: 19px; }
  .tag-today { display: inline-block; background: var(--gold); color: #1d2a22; font: 600 11px Inter, sans-serif;
    border-radius: 99px; padding: 1px 8px; margin-left: 6px; vertical-align: 3px; letter-spacing: .02em; }
  .meta { color: var(--muted); margin: 2px 0 8px; font-size: 14px; }
  .count { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--chip); border-radius: 99px; padding: 4px 10px; font-size: 14px;
    display: inline-flex; align-items: center; gap: 4px; }
  .chip.mine { background: var(--gold); color: #1d2a22; font-weight: 600; }
  .chip button { border: 0; background: rgba(0,0,0,.08); border-radius: 50%; width: 20px; height: 20px;
    line-height: 18px; padding: 0; cursor: pointer; font-size: 14px; color: inherit; }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--forest); color: #fff; }
  .btn.going { background: var(--gold); color: #1d2a22; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .is-cancelled .when { background: #9aa39e !important; }
  .is-cancelled h3 { text-decoration: line-through; color: var(--muted); }
  .cancel-note { background: rgba(214,69,65,.1); color: var(--red); border-radius: 8px; padding: 6px 10px; font-size: 14px; margin: 0 0 8px; font-weight: 600; }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head h2 { font-size: 22px; }
  .nav-btn { background: var(--chip); border: 0; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dname { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; font-weight: 600; }
  .day { aspect-ratio: 1 / 1; border: 0; background: transparent; border-radius: 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; }
  .day .n { font-size: 15px; }
  .day.out { visibility: hidden; }
  .day.today .n { background: var(--forest); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; }
  .day.sel { background: var(--chip); outline: 2px solid var(--forest-2); }
  .dots { display: flex; gap: 3px; height: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot.WED { background: var(--wed); } .dot.SAT { background: var(--sat); } .dot.SUN { background: var(--sun); }
  .dot.ev { background: var(--gold); } .dot.ai { background: var(--ai); } .dot.ifaf { background: var(--ifaf); } .dot.x { background: #9aa39e; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item .bar { width: 4px; border-radius: 4px; flex: none; }
  .item .t { font-weight: 600; }
  .item .s { color: var(--muted); font-size: 14px; }
  .item .notes { font-size: 14px; margin-top: 2px; white-space: pre-wrap; }
  .going-toggle { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--chip); color: var(--ink); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .going-toggle[disabled] { cursor: default; opacity: .75; }
  .going-toggle .chev { transition: transform .2s; color: var(--muted); }
  .going-toggle.open .chev { transform: rotate(180deg); }
  .type-pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  /* Tips */
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
  .filters button.on { background: var(--forest); color: #fff; border-color: var(--forest); }
  .tip { padding: 0; overflow: hidden; }
  .tip .thumb { display: block; position: relative; aspect-ratio: 16 / 9; background: #000; }
  .tip .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
  .tip .thumb .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .tip .inner { padding: 12px 14px 14px; }
  .tip h3 { font-size: 19px; }
  .tip .cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .tip p { margin: 4px 0 0; white-space: pre-wrap; }
  .tip a.link { display: inline-block; margin-top: 8px; color: var(--forest-2); font-weight: 600; word-break: break-all; }

  /* Admin forms */
  details.admin { border: 1px dashed var(--gold); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; background: rgba(242,183,5,.06); }
  details.admin summary { cursor: pointer; font-weight: 600; }
  .form { display: grid; gap: 10px; margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }

  /* Tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 9px 0 10px; cursor: pointer; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; }
  nav.tabs button.on { color: var(--forest-2); }
  nav.tabs svg { width: 23px; height: 23px; }
  nav.tabs button { font-size: 11px; min-width: 0; letter-spacing: -.01em; }

  /* Overlay + toast */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; padding: 18px; width: 100%; max-width: 340px; }
  .modal h2 { font-size: 22px; margin-bottom: 8px; }
  .modal .actions { margin-top: 12px; justify-content: flex-end; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #1d2a22; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: all .25s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--red); }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .spin { width: 36px; height: 36px; margin: 0 auto 12px; border-radius: 50%;
    border: 4px solid var(--chip); border-top-color: var(--forest-2); animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
  .gated #bellBtn { display: none !important; }
  #bellBtn.on { background: rgba(255,255,255,.12); color: var(--gold); }
  #bellBtn.on svg path:first-child { fill: currentColor; }
  .brand .icon-btn + .icon-btn { margin-left: -4px; }
  @media (max-width: 420px) { .brand { gap: 8px; } .brand h1 { font-size: 21px; line-height: 1.02; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; } .brand .icon-btn { width: 34px; height: 34px; } .brand .icon-btn + .icon-btn { margin-left: -3px; } }
  .notify h2 { margin-top: 0; }
  .ntype { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .ntype:first-of-type { border-top: 0; }
  .ntype input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--forest-2); }
  .ntype b { display: block; }
  .ntype span { font-size: 13px; color: var(--muted); }
  .ntype.soon { opacity: .55; }
  .soon-tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; background: var(--chip); color: var(--muted); padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .move-card { background: #e8f2fb; border-color: #9cc6e8; }
  .move-card .btn { margin-top: 10px; display: inline-block; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .move-card { background: #16314a; border-color: #2c5a82; } }
  .status-on { color: var(--sun); font-weight: 600; }
</style>

      '<div class="week-dates">Mon ' + a.getDate() + ' ' + MON[a.getMonth()] + ' – Sun ' + b.getDate() + ' ' + MON[b.getMonth()] + '</div></div>' +
      '<div class="week-sum">' + (mineCount ? '<span class="pill mine">You: ' + mineCount + ' of ' + wk.items.length + '</span>' : '') +
      '<span class="pill">' + total + ' sign-up' + (total === 1 ? '' : 's') + '</span></div></div>';
    if (S.week === 0) {
      h += '<p class="hint">Tap “I’m going” to put your name down. Tap × on your name to take it off.' +
        (wk.sessions.length < d.schedule.length ? ' Earlier sessions this week are finished.' : '') + '</p>';
    }

    wk.items.forEach(function (s) { h += signupCard(s, tomorrow); });

    if (S.week < weeks.length - 1) {
      h += '<button class="next-week" data-act="week" data-i="' + (S.week + 1) + '">' + weekName(S.week + 1) +
        ' · ' + shortRange(weeks[S.week + 1].start, weeks[S.week + 1].end) + ' →</button>';
    }
    if (later.length) {
      h += '<h2 class="section-title" style="margin-top:18px">Club events further ahead</h2>';
      later.forEach(function (e) { h += signupCard(e, tomorrow); });
    }
    return h;
  }

  // One sign-up card: a regular session, or a club event that takes sign-ups
  function signupCard(s, tomorrow) {
    var d = S.data, isEvent = !s.code;
    var dt = parseD(s.date);
    var mine = s.names.filter(function (n) { return n.mine; })[0];
    var tag = s.date === d.today ? '<span class="tag-today">TODAY</span>' : s.date === tomorrow ? '<span class="tag-today">TOMORROW</span>' : '';
    var title = isEvent ? s.title : s.label;
    var meta = isEvent ? [s.time, s.location].filter(Boolean).join(' · ') : (s.time + (s.place ? ' · ' + s.place : ''));
    return '<article class="card session ' + (isEvent ? 'event' : s.code.toLowerCase()) + (s.cancelled ? ' is-cancelled' : '') + '">' +
      '<div class="when"' + (isEvent ? ' style="background:' + (TYPE_COLOR[s.type] || 'var(--gold)') + '"' : '') + '><span class="dow">' + DOW[dt.getDay()] + '</span><span class="dnum">' + dt.getDate() + '</span><span class="mon">' + MON[dt.getMonth()] + '</span></div>' +
      '<div class="body">' + (isEvent ? '<div class="type-pill">Club event · ' + esc(s.type) + '</div>' : '') +
      '<h3>' + esc(title) + tag + '</h3>' +
      (meta ? '<p class="meta">' + esc(meta) + '</p>' : '') +
      (isEvent && s.notes ? '<p class="meta" style="white-space:pre-wrap;color:var(--ink)">' + esc(s.notes) + '</p>' : '') +
      (s.cancelled ? '<p class="cancel-note">Cancelled' + (s.reason ? ' — ' + esc(s.reason) : '') + '</p>' : '') +
      '<div class="count">' + (s.names.length ? s.names.length + ' going' : '') + '</div>' +
      '<div class="names">' + (s.names.length ? s.names.map(function (n) {
        var canRemove = n.mine || S.pin;
        return '<span class="chip' + (n.mine ? ' mine' : '') + '">' + esc(n.name) +
          (canRemove ? '<button data-act="remove" data-key="' + esc(s.key) + '" data-name="' + esc(n.name) + '" aria-label="Remove ' + esc(n.name) + '">×</button>' : '') +
          '</span>';
      }).join('') : (s.cancelled ? '' : '<span class="empty">No one down yet</span>')) + '</div>' +
      '<div class="actions">' +
      (s.cancelled ? '' : (mine
        ? '<button class="btn going" data-act="remove" data-key="' + esc(s.key) + '" data-name="' + esc(mine.name) + '">✓ You’re going · cancel</button>'
        : '<button class="btn primary" data-act="join" data-key="' + esc(s.key) + '">I’m going</button>')) +
      (!isEvent && !s.cancelled && s.date === d.today ? '<button class="btn soon" disabled title="Coming soon">Sign in · coming soon</button>' : '') +
      (S.pin && !isEvent ? (s.cancelled
        ? '<button class="btn ghost small" data-act="reinstate" data-key="' + esc(s.key) + '">Reinstate session</button>'
        : '<button class="btn danger small" data-act="cancelSession" data-key="' + esc(s.key) + '">Cancel session</button>') : '') +
      '</div></div></article>';
  }

  function regularFor(dateStr) {
    var dow = parseD(dateStr).getDay();
    return S.data.schedule.filter(function (x) { return x.dow === dow; }).map(function (x) {
      var key = dateStr + '_' + x.code;
      var cancelled = Object.prototype.hasOwnProperty.call(S.data.cancelled, key);
      var session = S.data.sessions.filter(function (s) { return s.key === key; })[0] || null;
      return { key: key, code: x.code, label: x.label, time: x.time, place: x.place, cancelled: cancelled,
        reason: S.data.cancelled[key] || '', session: session };
    });
  }
  // Attendance count on the calendar's selected day; tap to show the names
  function goingBlock(r) {
    if (r.cancelled) return '';
    var s = r.session;
    if (!s) return S.sel >= S.data.today ? '<div class="s" style="margin-top:6px;font-style:italic">Sign-up opens closer to the date</div>' : '';
    return goingControls(s);
  }
  function goingControls(s) {
    var n = s.names.length, open = S.showGoing === s.key;
    var mine = s.names.filter(function (x) { return x.mine; })[0];
    var h = '<button class="going-toggle' + (open ? ' open' : '') + '" data-act="toggleGoing" data-key="' + esc(s.key) + '"' + (n ? '' : ' disabled') + '>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>' +
      '<strong>' + n + '</strong> going' + (n ? '<span class="chev">▾</span>' : '') + '</button>';
    if (open && n) {
      h += '<div class="names" style="margin-top:8px">' + s.names.map(function (x) {
        return '<span class="chip' + (x.mine ? ' mine' : '') + '">' + esc(x.name) + '</span>';
      }).join('') + '</div>';
    }
    h += '<div class="actions" style="margin-top:8px">' + (mine
      ? '<button class="btn going small" data-act="remove" data-key="' + esc(s.key) + '" data-name="' + esc(mine.name) + '">✓ You’re going · cancel</button>'
      : '<button class="btn primary small" data-act="join" data-key="' + esc(s.key) + '">I’m going</button>') + '</div>';
    return h;
  }
  function eventsFor(dateStr) {
    return S.data.events.filter(function (e) { return e.date <= dateStr && dateStr <= (e.endDate || e.date); });
  }
  var TYPE_COLOR = { 'Archery Ireland': 'var(--ai)', IFAF: 'var(--ifaf)', Competition: 'var(--red)', Social: 'var(--gold)', Training: 'var(--blue)', Notice: 'var(--forest-2)', Other: 'var(--muted)' };
  var CODE_COLOR = { WED: 'var(--wed)', SAT: 'var(--sat)', SUN: 'var(--sun)' };

  function renderCalendar() {
    var d = S.data;
    if (!S.month) { var t = parseD(d.today); S.month = [t.getFullYear(), t.getMonth()]; }
    if (!S.sel) S.sel = d.today;
    var y = S.month[0], m = S.month[1];
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7; // Monday first
    var days = new Date(y, m + 1, 0).getDate();

    var h = '<div class="card"><div class="cal-head">' +
      '<button class="nav-btn" data-act="prevMonth" aria-label="Previous month">‹</button>' +
      '<h2>' + MON_LONG[m] + ' ' + y + '</h2>' +
      '<button class="nav-btn" data-act="nextMonth" aria-label="Next month">›</button></div>' +
      '<div class="grid">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (n) { return '<div class="dname">' + n + '</div>'; }).join('');
    for (var i = 0; i < offset; i++) h += '<div class="day out"></div>';
    for (var day = 1; day <= days; day++) {
      var ds = fmtD(new Date(y, m, day));
      var dots = regularFor(ds).map(function (r) { return '<i class="dot ' + (r.cancelled ? 'x' : r.code) + '"></i>'; }).join('') +
        eventDots(eventsFor(ds));
      h += '<button class="day' + (ds === d.today ? ' today' : '') + (ds === S.sel ? ' sel' : '') + '" data-act="pickDay" data-date="' + ds + '">' +
        '<span class="n">' + day + '</span><span class="dots">' + dots + '</span></button>';
    }
    h += '</div><div class="legend"><span><i class="dot WED"></i>Wed practice</span><span><i class="dot SAT"></i>Sat practice</span>' +
      '<span><i class="dot SUN"></i>Sun 3D</span><span><i class="dot ev"></i>Club event</span><span><i class="dot ai"></i>Archery Ireland</span><span><i class="dot ifaf"></i>IFAF</span><span><i class="dot x"></i>Cancelled</span></div></div>';

    // Selected day
    h += '<h2 class="section-title">' + esc(longDate(S.sel)) + '</h2><div class="card">';
    var items = '';
    regularFor(S.sel).forEach(function (r) {
      items += '<div class="item"><span class="bar" style="background:' + (r.cancelled ? '#9aa39e' : CODE_COLOR[r.code]) + '"></span><div>' +
        '<div class="t">' + esc(r.label) + (r.cancelled ? ' — cancelled' : '') + '</div>' +
        '<div class="s">' + esc(r.time) + (r.place ? ' · ' + esc(r.place) : '') + (r.reason ? ' · ' + esc(r.reason) : '') + '</div>' +
        goingBlock(r) + '</div></div>';
    });
    eventsFor(S.sel).forEach(function (e) { items += eventItem(e); });
    h += (items || '<div class="empty">Nothing on this day.</div>') + '</div>';

    // Admin: add an event, or edit one (the same form, filled in)
    if (S.pin) {
      var ed = S.editEvent ? d.events.filter(function (x) { return x.id === S.editEvent && !x.synced; })[0] : null;
      if (S.editEvent && !ed) S.editEvent = null;
      var f = ed || { date: S.sel, time: '', title: '', type: d.eventTypes[0], location: '', notes: '', link: '', rsvp: true };
      h += '<details class="admin' + (ed ? ' editing' : '') + '"' + (S.openForm === 'event' || ed ? ' open' : '') + ' data-form="event" id="eventForm">' +
        '<summary>' + (ed ? '✎ Editing: ' + esc(ed.title) : '＋ Add a date to the calendar') + '</summary>' +
        '<div class="form">' +
        '<div class="row2"><label>Date<input type="date" id="evDate" value="' + esc(f.date) + '"></label>' +
        '<label>Time<input type="time" id="evTime" value="' + esc(/^\d{1,2}:\d{2}$/.test(f.time) ? ('0' + f.time).slice(-5) : '') + '"></label></div>' +
        '<label>Title<input id="evTitle" maxlength="80" placeholder="e.g. Club 3D shoot" value="' + esc(f.title) + '"></label>' +
        '<div class="row2"><label>Type<select id="evType">' + d.eventTypes.map(function (t) {
          return '<option' + (t === f.type ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label>' +
        '<label>Where<input id="evLoc" maxlength="80" placeholder="Optional" value="' + esc(f.location) + '"></label></div>' +
        '<label>Notes<textarea id="evNotes" maxlength="500" placeholder="Optional">' + esc(f.notes) + '</textarea></label>' +
        '<label>Info or entry link<input id="evLink" type="url" inputmode="url" placeholder="https://… (optional)" value="' + esc(f.link) + '"></label>' +
        '<label class="check"><input type="checkbox" id="evRsvp"' + (f.rsvp ? ' checked' : '') + '> Members can say they’re going</label>' +
        (ed
          ? '<div class="actions"><button class="btn primary" data-act="saveEvent">Save changes</button><button class="btn ghost" data-act="cancelEdit">Cancel</button></div>'
          : '<button class="btn primary" data-act="addEvent">Add to calendar</button>') +
        '</div></details>';
    }

    // Coming up list
    var f = S.evFilter || 'All';
    var upcoming = d.events.filter(function (e) { return (e.endDate || e.date) >= d.today && (f === 'All' || orgOf(e) === f); }).slice(0, 20);
    h += '<h2 class="section-title">Coming up</h2><div class="filters">' + ['All', 'Club', 'Archery Ireland', 'IFAF'].map(function (c) {
      return '<button class="' + (f === c ? 'on' : '') + '" data-act="evFilter" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div><div class="card">' +
      (upcoming.length ? upcoming.map(function (e) { return eventItem(e, true); }).join('') : '<div class="empty">Nothing coming up' + (f === 'All' ? '' : ' for ' + esc(f)) + ' yet.</div>') + '</div>';
    return h;
  }

  function orgOf(e) { return e.type === 'Archery Ireland' || e.type === 'IFAF' ? e.type : 'Club'; }
  function eventDots(list) {
    var seen = {};
    return list.map(function (e) {
      var o = orgOf(e); if (seen[o]) return ''; seen[o] = 1;
      return '<i class="dot ' + (o === 'Archery Ireland' ? 'ai' : o === 'IFAF' ? 'ifaf' : 'ev') + '"></i>';
    }).join('');
  }
  function dateRange(e) {
    if (!e.endDate || e.endDate === e.date) return longDate(e.date);
    var a = parseD(e.date), b = parseD(e.endDate);
    return DOW[a.getDay()] + ' ' + a.getDate() + (a.getMonth() === b.getMonth() ? '' : ' ' + MON[a.getMonth()]) +
      ' – ' + DOW[b.getDay()] + ' ' + b.getDate() + ' ' + MON[b.getMonth()];
  }
  function eventItem(e, withDate) {
    var meta = [];
    if (withDate || (e.endDate && e.endDate !== e.date)) meta.push(dateRange(e));
    if (e.time) meta.push(e.time);
    if (e.location) meta.push(e.location);
    var linkStyle = 'display:inline-block;margin:4px 14px 0 0;color:var(--forest-2);font-weight:600';
    return '<div class="item"><span class="bar" style="background:' + (TYPE_COLOR[e.type] || 'var(--muted)') + '"></span><div style="flex:1;min-width:0">' +
      '<div class="type-pill">' + esc(e.type) + '</div>' +
      '<div class="t">' + esc(e.title) + '</div>' +
      (meta.length ? '<div class="s">' + esc(meta.join(' · ')) + '</div>' : '') +
      (e.notes ? '<div class="notes">' + esc(e.notes) + '</div>' : '') +
      (safeUrl(e.link) ? '<a class="link" style="' + linkStyle + '" href="' + esc(e.link) + '" target="_blank" rel="noopener">More info / enter ↗</a>' : '') +
      (safeUrl(e.map || '') ? '<a class="link" style="' + linkStyle + '" href="' + esc(e.map) + '" target="_blank" rel="noopener">Directions ↗</a>' : '') +
      (e.rsvp ? (e.date >= S.data.today ? goingControls(e)
        : '<div class="s" style="margin-top:6px">' + e.names.length + ' went</div>') : '') +
      (S.pin && !e.synced ? '<div class="actions" style="margin-top:6px"><button class="btn ghost small" data-act="editEvent" data-id="' + esc(e.id) + '">Edit</button>' +
        '<button class="btn danger small" data-act="deleteEvent" data-id="' + esc(e.id) + '">Delete</button></div>' : '') +
      '</div></div>';
  }

  function youtubeId(url) {
    var m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function safeUrl(url) { return /^https?:\/\//i.test(url) ? url : ''; }

  function renderTips() {
    var d = S.data;
    var cats = ['All'].concat(d.tipCategories);
    var label = { All: 'All', Tip: 'Tips', Video: 'Videos', Link: 'Links' };
    var h = searchBox('tipSearch', 'Search tips, videos and links', S.tipQuery) +
      '<div class="filters">' + cats.map(function (c) {
      return '<button class="' + (S.tipFilter === c ? 'on' : '') + '" data-act="tipFilter" data-cat="' + esc(c) + '">' + esc(label[c] || c) + '</button>';
    }).join('') + '</div>';

    if (S.pin) {
      h += '<details class="admin"' + (S.openForm === 'tip' ? ' open' : '') + ' data-form="tip"><summary>＋ Add a tip, video or link</summary><div class="form">' +
        '<label>Title<input id="tipTitle" maxlength="100" placeholder="e.g. Fixing a left-hand miss"></label>' +
        '<label>Type<select id="tipCat">' + d.tipCategories.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
        '<label>Link (YouTube or web page)<input id="tipUrl" type="url" inputmode="url" placeholder="https://… (optional for tips)"></label>' +
        '<label>Notes<textarea id="tipNotes" maxlength="1000" placeholder="The tip itself, or why the video is worth watching"></textarea></label>' +
        '<button class="btn primary" data-act="addTip">Add</button></div></details>';
    }

    return h + '<div id="tipList">' + tipListHtml() + '</div>';
  }

  function tipListHtml() {
    var d = S.data, h = '';
    var list = d.tips.filter(function (t) {
      return (S.tipFilter === 'All' || t.category === S.tipFilter) && matches(S.tipQuery, [t.title, t.notes, t.url, t.category]);
    });
    if (!list.length) return '<div class="card"><div class="empty">' + (S.tipQuery ? 'Nothing matches “' + esc(S.tipQuery) + '”.' : 'Nothing here yet.') + '</div></div>';
    list.forEach(function (t) {
      var url = safeUrl(t.url), yt = url && youtubeId(url);
      h += '<article class="card tip">' +
        (yt ? '<a class="thumb" href="' + esc(url) + '" target="_blank" rel="noopener"><img loading="lazy" alt="" onerror="this.style.visibility=\'hidden\'" src="https://img.youtube.com/vi/' + yt + '/hqdefault.jpg">' +
          '<span class="play"><svg width="64" height="46" viewBox="0 0 64 46"><rect width="64" height="46" rx="12" fill="#d64541"/><path d="M26 14l16 9-16 9z" fill="#fff"/></svg></span></a>' : '') +
        '<div class="inner"><div class="cat">' + esc(t.category) + '</div><h3>' + esc(t.title) + '</h3>' +
        (t.notes ? '<p>' + esc(t.notes) + '</p>' : '') +
        (url && !yt ? '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">Open link ↗</a>' : '') +
        (yt ? '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">Watch on YouTube ↗</a>' : '') +
        (S.pin ? '<div style="margin-top:10px"><button class="btn danger small" data-act="deleteTip" data-id="' + esc(t.id) + '">Delete</button></div>' : '') +
        '</div></article>';
    });
    return h;
  }

  /* ---------- search helpers ---------- */
  function searchBox(id, placeholder, value) {
    return '<div class="searchbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
      '<input id="' + id + '" type="search" autocomplete="off" placeholder="' + esc(placeholder) + '" value="' + esc(value || '') + '"></div>';
  }
  // Every word typed must appear somewhere in the fields (capitals and accents ignored)
  function fold(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function matches(q, fields) {
    q = fold(q).trim(); if (!q) return true;
    var hay = fold(fields.join(' '));
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function fmtTs(iso) {
    if (!iso) return '';
    var dt = new Date(iso), now = new Date();
    if (isNaN(dt)) return '';
    if (dt.toDateString() === now.toDateString()) return 'Today ' + ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
    return dt.getDate() + ' ' + MON[dt.getMonth()] + (dt.getFullYear() === now.getFullYear() ? '' : ' ' + dt.getFullYear());
  }
  function shortDate(s) { var x = parseD(s); return x.getDate() + ' ' + MON[x.getMonth()] + ' ' + x.getFullYear(); }
  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  // Make sure we know the member's name, asking once if not
  function withName(then) {
    var name = (store.get('ac_name') || '').trim();
    if (name) { then(name); return; }
    ask({ title: 'Your name', text: 'Shown with your post. This phone will remember it.', ok: 'Continue', input: { placeholder: 'e.g. Mary Byrne' } }).then(function (nm) {
      nm = (nm || '').slice(0, 40); if (!nm) return;
      store.set('ac_name', nm); saveNameSoon(); then(nm);
    });
  }

  /* ---------- forum ---------- */
  function renderForum() {
    var d = S.data;
    var open = S.thread && d.forum.filter(function (x) { return x.id === S.thread; })[0];
    if (S.thread && !open) S.thread = null;
    if (open) return renderThread(open);
    var h = searchBox('forumSearch', 'Search questions and answers', S.forumQuery);
    h += '<details class="ask"' + (S.openForm === 'forumNew' ? ' open' : '') + ' data-form="forumNew"><summary>＋ Ask a question</summary><div class="form">' +
      '<label>Question<input id="fqTitle" maxlength="120" placeholder="e.g. What poundage should a beginner start with?"></label>' +
      '<label>More details (optional)<textarea id="fqText" maxlength="3000" placeholder="Anything that helps people answer"></textarea></label>' +
      '<button class="btn primary" data-act="forumPost">Post question</button></div></details>';
    return h + '<div id="forumList">' + forumListHtml() + '</div>';
  }
  function forumListHtml() {
    var list = S.data.forum.filter(function (th) {
      return matches(S.forumQuery, [th.title, th.text, th.name].concat(th.replies.map(function (r) { return r.text + ' ' + r.name; })));
    });
    if (!list.length) return '<div class="card"><div class="empty">' + (S.forumQuery ? 'Nothing matches “' + esc(S.forumQuery) + '”.' : 'No questions yet. Be the first to ask one.') + '</div></div>';
    return list.map(function (th) {
      var n = th.replies.length;
      return '<button class="card thread-row" data-act="openThread" data-id="' + esc(th.id) + '">' +
        '<span class="t">' + esc(th.title) + '</span>' +
        '<span class="s">Asked by ' + esc(th.name) + ' · ' + esc(fmtTs(th.ts)) + '</span>' +
        '<span class="replies' + (n ? '' : ' none') + '">' + (n ? n + (n === 1 ? ' reply' : ' replies') + ' · latest ' + esc(fmtTs(th.last)) : 'No replies yet') + '</span>' +
        '</button>';
    }).join('');
  }
  function postHtml(p, isQuestion) {
    var canDelete = p.mine || S.pin;
    return '<div class="post' + (isQuestion ? ' question' : '') + (p.mine ? ' mine' : '') + '">' +
      '<div class="by"><strong>' + esc(p.name) + '</strong> · ' + esc(fmtTs(p.ts)) +
      (canDelete ? '<button class="del" data-act="forumDelete" data-id="' + esc(p.id) + '" data-q="' + (isQuestion ? 1 : 0) + '">Delete</button>' : '') + '</div>' +
      '<div class="txt">' + esc(p.text) + '</div></div>';
  }
  function renderThread(th) {
    var h = '<button class="back" data-act="closeThread">‹ All questions</button>';
    h += '<article class="card thread"><h2>' + esc(th.title) + '</h2>' + postHtml(th, true) + '</article>';
    h += '<h2 class="section-title">' + (th.replies.length ? th.replies.length + (th.replies.length === 1 ? ' reply' : ' replies') : 'No replies yet') + '</h2>';
    th.replies.forEach(function (r) { h += '<div class="card reply">' + postHtml(r, false) + '</div>'; });
    h += '<div class="card"><div class="form" style="margin-top:0"><label>Your reply<textarea id="frText" maxlength="3000" placeholder="Share what you know"></textarea></label>' +
      '<button class="btn primary" data-act="forumReply" data-id="' + esc(th.id) + '">Post reply</button></div></div>';
    return h;
  }

  /* ---------- club info and honours board ---------- */
  var COPYABLE = /iban|bic|reference/i;
  function renderClub() {
    var d = S.data, h = '';
    if (S.pin) h += '<p class="hint">To change the club information below, edit the <b>Club</b> tab in the Google Sheet.</p>';
    if (!d.clubInfo.length) h += '<div class="card"><div class="empty">No club information yet.</div></div>';
    d.clubInfo.forEach(function (sec) {
      var isCommittee = /committee/i.test(sec.name);
      h += '<section class="card club-sec"><h2>' + esc(sec.name) + '</h2>';
      sec.items.forEach(function (it) {
        var placeholder = /^\[.*\]$/.test(it.details);
        var copy = COPYABLE.test(it.title) && it.details && !placeholder;
        if (isCommittee) {
          h += '<div class="role"><span class="r">' + esc(it.title) + '</span><span class="n' + (placeholder ? ' ph' : '') + '">' + esc(it.details) + '</span></div>';
        } else {
          h += '<div class="info">' + (it.title ? '<div class="it">' + esc(it.title) + '</div>' : '') +
            (it.details ? '<div class="id' + (placeholder ? ' ph' : '') + (copy ? ' mono' : '') + '">' + esc(it.details) +
              (copy ? ' <button class="copy" data-act="copy" data-text="' + esc(it.details) + '">Copy</button>' : '') + '</div>' : '') + '</div>';
        }
      });
      h += '</section>';
    });
    return h;
  }
  var TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>';
  function renderHonoursPage() {
    var d = S.data;
    var list = d.results.filter(function (r) { return (!S.resYear || r.date.slice(0, 4) === S.resYear) && (!S.resName || r.name === S.resName); });
    var count = function (n) { return list.filter(function (r) { return r.place === n; }).length; };
    var h = '<section class="honours-hero"><div class="trophy">' + TROPHY + '</div>' +
      '<h1>Honours board</h1><p>' + esc(d.club) + ' on the podium</p>' +
      (d.results.length ? '<div class="tally">' +
        '<span><i class="medal gold sm"></i><b>' + count(1) + '</b> gold</span>' +
        '<span><i class="medal silver sm"></i><b>' + count(2) + '</b> silver</span>' +
        '<span><i class="medal bronze sm"></i><b>' + count(3) + '</b> bronze</span></div>' +
        '<div class="tally-note">' + (S.resYear || 'All years') + (S.resName ? ' · ' + esc(S.resName) : '') + '</div>' : '') +
      '</section>';
    return h + renderHonours();
  }
  // Podium finishes in the last 30 days, shown on the Sign up tab
  function congratsCard() {
    var d = S.data, since = addDays(d.today, -30);
    var recent = d.results.filter(function (r) { return r.place <= 3 && r.date >= since && r.date <= d.today; }).slice(0, 3);
    if (!recent.length) return '';
    var medals = { 1: 'gold', 2: 'silver', 3: 'bronze' };
    return '<section class="card congrats"><div class="cg-head">' + TROPHY + '<strong>Congratulations!</strong></div>' +
      recent.map(function (r) {
        return '<div class="cg-row"><span class="medal sm ' + medals[r.place] + '"></span><div><b>' + esc(r.name) + '</b> — ' + ordinal(r.place) +
          (r.category ? ', ' + esc(r.category) : '') + '<div class="s">' + esc(r.competition) + ' · ' + esc(shortDate(r.date)) + '</div></div></div>';
      }).join('') +
      '<button class="btn ghost small" data-act="goTab" data-tab="honours">See the honours board ›</button></section>';
  }

  function renderHonours() {
    var d = S.data, all = d.results;
    var years = all.map(function (r) { return r.date.slice(0, 4); }).filter(function (y, i, a) { return a.indexOf(y) === i; });
    var names = all.map(function (r) { return r.name; }).filter(function (n, i, a) { return a.indexOf(n) === i; }).sort();
    if (S.resYear && years.indexOf(S.resYear) < 0) S.resYear = '';
    if (S.resName && names.indexOf(S.resName) < 0) S.resName = '';
    var h = '';
    if (S.pin) {
      h += '<details class="admin"' + (S.openForm === 'result' ? ' open' : '') + ' data-form="result"><summary>＋ Add a result</summary><div class="form">' +
        '<label>Competition<input id="rsComp" maxlength="100" placeholder="e.g. IFAF 3D Championships"></label>' +
        '<div class="row2"><label>Date<input type="date" id="rsDate" value="' + esc(d.today) + '"></label>' +
        '<label>Placing<input type="number" id="rsPlace" min="1" max="500" inputmode="numeric" placeholder="1 = 1st"></label></div>' +
        '<label>Member<input id="rsName" maxlength="60" list="rsNames" placeholder="Their name"></label>' +
        '<datalist id="rsNames">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
        '<div class="row2"><label>Category<input id="rsCat" maxlength="60" list="rsCats" placeholder="e.g. Barebow Men"></label>' +
        '<label>Where<input id="rsVenue" maxlength="80" placeholder="Optional"></label></div>' +
        '<datalist id="rsCats">' + d.resultCategories.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>' +
        '<button class="btn primary" data-act="addResult">Add result</button></div></details>';
    }
    if (!all.length) return h + '<div class="card"><div class="empty">No results yet.' + (S.pin ? '' : ' Club members’ competition placings will appear here.') + '</div></div>';
    h += '<div class="res-filters"><select id="resYear" aria-label="Year"><option value="">All years</option>' +
      years.map(function (y) { return '<option' + (y === S.resYear ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<select id="resName" aria-label="Member"><option value="">All members</option>' +
      names.map(function (n) { return '<option' + (n === S.resName ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></div>';
    var list = all.filter(function (r) { return (!S.resYear || r.date.slice(0, 4) === S.resYear) && (!S.resName || r.name === S.resName); });
    var medals = { 1: 'gold', 2: 'silver', 3: 'bronze' };
    h += '<div class="card">' + (list.length ? list.map(function (r) {
      return '<div class="result"><span class="medal ' + (medals[r.place] || 'other') + '">' + ordinal(r.place) + '</span><div class="rb">' +
        '<div class="t">' + esc(r.name) + (r.category ? ' <span class="cat">' + esc(r.category) + '</span>' : '') + '</div>' +
        '<div class="s">' + esc(r.competition) + ' · ' + esc(shortDate(r.date)) + (r.venue ? ' · ' + esc(r.venue) : '') + '</div>' +
        (S.pin ? '<button class="btn danger small" style="margin-top:6px" data-act="deleteResult" data-id="' + esc(r.id) + '">Delete</button>' : '') +
        '</div></div>';
    }).join('') : '<div class="empty">No results for that choice.</div>') + '</div>';
    return h;
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? 'Copied' : 'Couldn’t copy — press and hold the text to copy it', !ok);
    }
    try { navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback); } catch (e) { fallback(); }
  }

  /* ---------- events ---------- */
  document.addEventListener('input', function (e) {
    if (e.target.id === 'myname') { store.set('ac_name', e.target.value.trim()); saveNameSoon(); }
    if (e.target.id === 'tipSearch') { S.tipQuery = e.target.value; var tl = $('tipList'); if (tl) tl.innerHTML = tipListHtml(); }
    if (e.target.id === 'forumSearch') { S.forumQuery = e.target.value; var fl = $('forumList'); if (fl) fl.innerHTML = forumListHtml(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'resYear') { S.resYear = e.target.value; render(); }
    if (e.target.id === 'resName') { S.resName = e.target.value; render(); }
    if (e.target.closest && e.target.closest('.ntype') && S.data && S.data.push && S.data.push.on) {
      var prefs = chosenPrefs(), fcm = store.get('ac_fcm');
      if (!fcm) { toast('Turn notifications off and on again to change these', true); return; }
      act(function () { return call('pushSave', TOKEN, fcm, prefs); }, 'Saved', function (d) { d.push.prefs = prefs; });
    }
  });
  document.addEventListener('toggle', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-form');
    if (f) S.openForm = e.target.open ? f : null;
    if (f === 'event' && !e.target.open && S.editEvent) { S.editEvent = null; render(); }
  }, true);

  document.addEventListener('click', function (e) {
    var tabBtn = e.target.closest('nav.tabs button');
    if (tabBtn) { S.tab = tabBtn.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.getAttribute('data-act');
    var key = el.getAttribute('data-key');

    if (a === 'join') {
      var name = (store.get('ac_name') || '').trim();
      if (name) { act(function () { return call('signUp', key, name, TOKEN); }, 'You’re down — see you there!', addMe(key, name)); return; }
      ask({ title: 'Your name', text: 'This phone will remember it.', ok: 'Put me down', input: { placeholder: 'e.g. Mary Byrne' } }).then(function (nm) {
        nm = (nm || '').slice(0, 40);
        if (!nm) return;
        store.set('ac_name', nm);
        act(function () { return call('signUp', key, nm, TOKEN); }, 'You’re down — see you there!', addMe(key, nm));
      });
    } else if (a === 'remove') {
      var nm = el.getAttribute('data-name');
      ask({ title: 'Take ' + nm + ' off?', text: 'They’ll be removed from this session.', ok: 'Remove', danger: true }).then(function (yes) {
        if (yes) act(function () { return call('removeSignup', key, nm, TOKEN, S.pin || ''); }, 'Removed', function (d) {
          var it = findItem(d, key); if (it) it.names = it.names.filter(function (n) { return n.name !== nm; });
        });
      });
    } else if (a === 'cancelSession') {
      ask({ title: 'Cancel this session?', text: 'Members will see it as cancelled. Add a reason if you like.',
        ok: 'Cancel session', danger: true, input: { placeholder: 'e.g. Range closed for maintenance' } }).then(function (reason) {
        if (reason !== null) act(function () { return call('setCancelled', S.pin, key, true, reason, TOKEN); }, 'Session cancelled', function (d) {
          d.cancelled[key] = reason; var it = findItem(d, key); if (it) { it.cancelled = true; it.reason = reason; }
        });
      });
    } else if (a === 'reinstate') {
      act(function () { return call('setCancelled', S.pin, key, false, '', TOKEN); }, 'Session reinstated', function (d) {
        delete d.cancelled[key]; var it = findItem(d, key); if (it) { it.cancelled = false; it.reason = ''; }
      });
    } else if (a === 'prevMonth' || a === 'nextMonth') {
      var dt = new Date(S.month[0], S.month[1] + (a === 'nextMonth' ? 1 : -1), 1);
      S.month = [dt.getFullYear(), dt.getMonth()];
      render();
    } else if (a === 'pickDay') {
      S.sel = el.getAttribute('data-date'); S.showGoing = null; render();
    } else if (a === 'toggleGoing') {
      S.showGoing = S.showGoing === key ? null : key; render();
    } else if (a === 'addEvent') {
      var ev = {
        date: $('evDate').value, time: $('evTime').value, title: $('evTitle').value,
        type: $('evType').value, location: $('evLoc').value, notes: $('evNotes').value, link: $('evLink').value.trim(), rsvp: $('evRsvp').checked
      };
      var evBtn = el, evLabel = el.textContent; busyButton(evBtn);
      act(function () { return call('addEvent', S.pin, ev, TOKEN); }, 'Added to the calendar')
        .then(function (ok) { if (!ok && evBtn.isConnected) { evBtn.disabled = false; evBtn.textContent = evLabel; } });
    } else if (a === 'editEvent') {
      S.editEvent = el.getAttribute('data-id'); S.openForm = 'event'; render();
      var form = $('eventForm');
      if (form) window.scrollTo({ top: Math.max(0, form.getBoundingClientRect().top + window.scrollY - document.querySelector('header.top').offsetHeight - 12), behavior: 'smooth' });
    } else if (a === 'cancelEdit') {
      S.editEvent = null; S.openForm = null; render();
    } else if (a === 'saveEvent') {
      var edId = S.editEvent;
      var upd = {
        date: $('evDate').value, time: $('evTime').value, title: $('evTitle').value.trim(),
        type: $('evType').value, location: $('evLoc').value.trim(), notes: $('evNotes').value.trim(), link: $('evLink').value.trim(), rsvp: $('evRsvp').checked
      };
      if (!upd.date || !upd.title) { toast(!upd.date ? 'Please pick a date.' : 'Please give the event a title.', true); return; }
      S.editEvent = null; S.openForm = null;
      act(function () { return call('updateEvent', S.pin, edId, upd, TOKEN); }, 'Changes saved', function (d) {
        d.events.forEach(function (x) {
          if (x.id !== edId) return;
          ['date', 'time', 'title', 'type', 'location', 'notes', 'link', 'rsvp'].forEach(function (k) { x[k] = upd[k]; });
          x.endDate = upd.date;
          if (upd.rsvp && !x.key) { x.key = 'EV_' + x.id; x.names = x.names || []; }
        });
        d.events.sort(function (p, q) { return (p.date + (p.time || '')).localeCompare(q.date + (q.time || '')); });
        S.sel = upd.date; var nd = parseD(upd.date); S.month = [nd.getFullYear(), nd.getMonth()];
      });
    } else if (a === 'deleteEvent') {
      var evId = el.getAttribute('data-id');
      ask({ title: 'Delete this event?', ok: 'Delete', danger: true }).then(function (yes) {
        if (yes) act(function () { return call('deleteEvent', S.pin, evId, TOKEN); }, 'Deleted', function (d) { d.events = d.events.filter(function (x) { return x.id !== evId; }); });
      });
    } else if (a === 'pushOn') {
      pushOn();
    } else if (a === 'pushOff') {
      pushOff();
    } else if (a === 'pushTest') {
      el.disabled = true;
      call('pushTest', TOKEN).then(function () { toast('Test sent. It should arrive in a few seconds.'); })
        .catch(function (e) { if (!(e && e.gate)) toast(errMsg(e), true); })
        .then(function () { if (el.isConnected) el.disabled = false; });
    } else if (a === 'closeTip') {
      S.iosTipClosed = true; render();
    } else if (a === 'week') {
      S.week = Number(el.getAttribute('data-i')) || 0;
      render();
      var tabs = document.querySelector('.weektabs');
      if (tabs) window.scrollTo({ top: Math.max(0, tabs.getBoundingClientRect().top + window.scrollY - document.querySelector('header.top').offsetHeight - 12), behavior: 'smooth' });
    } else if (a === 'goTab') {
      S.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0, 0);
    } else if (a === 'openThread') {
      S.thread = el.getAttribute('data-id'); render(); window.scrollTo(0, 0);
    } else if (a === 'closeThread') {
      S.thread = null; render(); window.scrollTo(0, 0);
    } else if (a === 'forumPost') {
      var qTitle = $('fqTitle').value.trim(), qText = $('fqText').value.trim();
      if (!qTitle) { toast('Please write your question', true); $('fqTitle').focus(); return; }
      var postBtn = el;
      withName(function (nm) {
        busyButton(postBtn);
        act(function () { return call('forumPost', TOKEN, nm, qTitle, qText); }, 'Question posted').then(function (ok) {
          if (ok) { S.openForm = null; S.forumQuery = ''; render(); }
          else if (postBtn.isConnected) { postBtn.disabled = false; postBtn.textContent = 'Post question'; }
        });
      });
    } else if (a === 'forumReply') {
      var rText = $('frText').value.trim(), thId = el.getAttribute('data-id');
      if (!rText) { toast('Please write a reply', true); $('frText').focus(); return; }
      var replyBtn = el;
      withName(function (nm) {
        busyButton(replyBtn);
        act(function () { return call('forumReply', TOKEN, nm, thId, rText); }, 'Reply posted').then(function (ok) {
          if (!ok && replyBtn.isConnected) { replyBtn.disabled = false; replyBtn.textContent = 'Post reply'; }
        });
      });
    } else if (a === 'forumDelete') {
      var postId = el.getAttribute('data-id'), isQ = el.getAttribute('data-q') === '1';
      ask({ title: isQ ? 'Delete this question?' : 'Delete this reply?', text: isQ ? 'Its replies will be deleted too.' : '', ok: 'Delete', danger: true }).then(function (yes) {
        if (!yes) return;
        act(function () { return call('forumDelete', TOKEN, postId, S.pin || ''); }, 'Deleted', function (d) {
          if (isQ) { d.forum = d.forum.filter(function (x) { return x.id !== postId; }); if (S.thread === postId) S.thread = null; }
          else d.forum.forEach(function (x) { x.replies = x.replies.filter(function (r) { return r.id !== postId; }); });
        });
      });
    } else if (a === 'copy') {
      copyText(el.getAttribute('data-text'));
    } else if (a === 'addResult') {
      var res = { competition: $('rsComp').value.trim(), date: $('rsDate').value, place: $('rsPlace').value, name: $('rsName').value.trim(),
        category: $('rsCat').value.trim(), venue: $('rsVenue').value.trim() };
      if (!res.competition || !res.date || !res.name || !(parseInt(res.place, 10) >= 1)) { toast('Please fill in the competition, date, placing and member', true); return; }
      var resBtn = el; busyButton(resBtn);
      act(function () { return call('addResult', S.pin, res, TOKEN); }, 'Result added')
        .then(function (ok) { if (!ok && resBtn.isConnected) { resBtn.disabled = false; resBtn.textContent = 'Add result'; } });
    } else if (a === 'deleteResult') {
      var resId = el.getAttribute('data-id');
      ask({ title: 'Delete this result?', ok: 'Delete', danger: true }).then(function (yes) {
        if (yes) act(function () { return call('deleteResult', S.pin, resId, TOKEN); }, 'Deleted', function (d) { d.results = d.results.filter(function (x) { return x.id !== resId; }); });
      });
    } else if (a === 'evFilter') {
      S.evFilter = el.getAttribute('data-cat'); render();
    } else if (a === 'tipFilter') {
      S.tipFilter = el.getAttribute('data-cat'); render();
    } else if (a === 'addTip') {
      var tip = { title: $('tipTitle').value, category: $('tipCat').value, url: $('tipUrl').value.trim(), notes: $('tipNotes').value };
      var tipBtn = el, tipLabel = el.textContent; busyButton(tipBtn);
      act(function () { return call('addTip', S.pin, tip, TOKEN); }, 'Added')
        .then(function (ok) { if (!ok && tipBtn.isConnected) { tipBtn.disabled = false; tipBtn.textContent = tipLabel; } });
    } else if (a === 'deleteTip') {
      var tipId = el.getAttribute('data-id');
      ask({ title: 'Delete this?', ok: 'Delete', danger: true }).then(function (yes) {
        if (yes) act(function () { return call('deleteTip', S.pin, tipId, TOKEN); }, 'Deleted', function (d) { d.tips = d.tips.filter(function (x) { return x.id !== tipId; }); });
      });
    }
  });

  /* ---------- admin unlock ---------- */
  $('adminBtn').addEventListener('click', function () {
    if (S.pin) return;
    ask({ title: 'Admin PIN', ok: 'Unlock', input: { type: 'password', inputmode: 'numeric', placeholder: 'Enter PIN' } }).then(function (pin) {
      if (!pin) return;
      call('checkPin', pin).then(function (ok) {
        if (ok) { S.pin = pin; render(); toast('Admin mode on'); }
        else toast('Wrong PIN', true);
      }).catch(function (e) { if (!(e && e.gate)) toast(errMsg(e), true); });
    });
  });
  $('adminOff').addEventListener('click', function () { S.pin = null; S.openForm = null; render(); });

  $('bellBtn').addEventListener('click', function () {
    S.tab = 'notify'; render(); window.scrollTo(0, 0);
    if (!IN_GAS && S.data && S.data.push && S.data.push.ready) {
      firebaseReady().then(function (fb) { if (fb.unsupported && !S.pushUnsupported && !(IS_IOS && !STANDALONE)) { S.pushUnsupported = true; if (S.tab === 'notify') render(); } });
    }
  });

  /* ---------- refresh ---------- */
  $('refreshBtn').addEventListener('click', function () { load().then(function () { toast('Up to date'); }); });
  function quietRefresh() {
    if (document.hidden || S.busy || S.pending) return;
    var a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // don't interrupt typing
    if (S.openForm || $("dlg").classList.contains("show")) return;
    load(true);
  }
  // Opening the app clears its notifications from the phone's shade (and the red badge on the icon)
  function clearShade() {
    if (IN_GAS) return;
    try { if (navigator.clearAppBadge) navigator.clearAppBadge().catch(function () {}); } catch (e) {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.getNotifications) return reg.getNotifications().then(function (list) { list.forEach(function (n) { n.close(); }); });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  clearShade();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { quietRefresh(); clearShade(); } });
  setInterval(quietRefresh, 60000);

  readUrl(function () {
    TOKEN = store.get('ac_token');
    if (!TOKEN) { TOKEN = rand(); store.set('ac_token', TOKEN); }
    syncUrl();
    load();
  });
})();
</script>
</body>
</html>
